name: Label Studio MVP CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Sticker-Bot-Sales/**"
      - ".github/workflows/label-studio-ci.yml"
  push:
    branches: [main, "feature/label-studio-nigeria-mvp"]
    paths:
      - "Sticker-Bot-Sales/**"
      - ".github/workflows/label-studio-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PORT: 8080
      BASE_PATH: /
    defaults:
      run:
        working-directory: Sticker-Bot-Sales
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
